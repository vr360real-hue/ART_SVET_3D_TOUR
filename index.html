<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0f38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>АРТ СВЕТ — 3D панорамный тур</title>
<meta name="description" content="Виртуальный 3D тур по магазину светильников АРТ СВЕТ (Самара).">
<meta property="og:title" content="АРТ СВЕТ — 3D панорамный тур" />
<meta property="og:description" content="Виртуальный 3D тур по магазину светильников АРТ СВЕТ" />
<meta property="og:image" content="https://avatars.mds.yandex.net/get-altay/18791287/2a000001a1c54408f9a5063027d65ff8fb7d/XXL" />
<meta property="og:type" content="website" />

<style>
  :root{
    --navy:#0a0f38;
    --navy-light:#1a2050;
    --burgundy:#ab073b;
    --burgundy-dark:#8a0530;
    --gray:#b2b6bd;
    --cream:#fdfdfd;
    --text:#0a0f38;
    --muted:#7a7f8f;
  }

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }

  html, body{ height:100%; }

  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:var(--text);
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
      radial-gradient(circle at 20% 10%, rgba(10,15,56,.12), transparent 55%),
      radial-gradient(circle at 90% 90%, rgba(171,7,59,.10), transparent 55%),
      linear-gradient(160deg, #f8f9fc 0%, #eef0f6 55%, #e0e3ec 100%);
    overflow-x:hidden;
  }

  .card{
    position:relative;
    width:100%;
    max-width:400px;
    background:#ffffff;
    border-radius:22px;
    padding:38px 26px 24px;
    text-align:center;
    box-shadow:
      0 24px 60px -18px rgba(10,15,56,.28),
      0 6px 20px -8px rgba(10,15,56,.14),
      0 0 0 1px rgba(10,15,56,.05);
    animation:cardIn .6s cubic-bezier(.2,.8,.3,1) both;
  }

  @keyframes cardIn{
    from{ opacity:0; transform:translateY(18px) scale(.985); }
    to  { opacity:1; transform:translateY(0) scale(1); }
  }

  .card::before{
    content:"";
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    width:64px; height:4px;
    border-radius:0 0 6px 6px;
    background:linear-gradient(90deg, var(--navy), var(--burgundy));
    opacity:.95;
  }

  /* ── Логотип ───────────────────────── */
  .logo-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:90px;
    margin-bottom:20px;
  }

  .logo{
    max-width:190px;
    max-height:90px;
    width:auto;
    height:auto;
    object-fit:contain;
    border-radius:10px;
    display:block;
  }

  #logoFallback{
    display:none;
    font-size:24px;
    font-weight:800;
    letter-spacing:5px;
    color:var(--navy);
  }

  /* ── Заголовок ─────────────────────── */
  .title{
    font-size:20px;
    font-weight:800;
    letter-spacing:1.6px;
    color:var(--navy);
    line-height:1.25;
    margin-bottom:8px;
    text-transform:uppercase;
  }

  .title span{
    display:inline-block;
    color:var(--burgundy);
  }

  .subtitle{
    font-size:12.5px;
    letter-spacing:.5px;
    color:var(--muted);
    line-height:1.45;
    margin-bottom:24px;
  }

  /* ── Кнопки ────────────────────────── */
  .btn{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:17px 20px;
    border-radius:14px;
    text-decoration:none;
    font-size:15px;
    font-weight:800;
    letter-spacing:.6px;
    color:#ffffff;
    overflow:hidden;
    transition:transform .18s ease, box-shadow .18s ease;
    -webkit-user-select:none; user-select:none;
    margin-bottom:12px;
  }

  .btn:last-of-type{ margin-bottom:20px; }

  .btn::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(120deg, rgba(255,255,255,.20), transparent 45%);
    opacity:0;
    transition:opacity .2s ease;
    pointer-events:none;
  }

  .btn .icon{
    flex:0 0 auto;
    width:42px; height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,.16);
    border-radius:11px;
  }

  .btn .icon svg{
    width:24px; height:24px;
    stroke:#ffffff;
  }

  .btn .label{
    flex:1 1 auto;
    text-align:left;
    line-height:1.15;
  }

  .btn .label small{
    display:block;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:.4px;
    opacity:.78;
    margin-top:4px;
    text-transform:none;
  }

  .btn .arrow{
    flex:0 0 auto;
    font-size:18px;
    opacity:.85;
    transition:transform .18s ease;
  }

  /* Тёмно-синяя (3D тур) */
  .btn.primary{
    background:linear-gradient(135deg, var(--navy), var(--navy-light));
    box-shadow:0 10px 24px -8px rgba(10,15,56,.65);
  }

  /* Бордовая (Наша визитка) — как раньше был WhatsApp */
  .btn.accent{
    background:linear-gradient(135deg, var(--burgundy), var(--burgundy-dark));
    box-shadow:0 10px 24px -8px rgba(171,7,59,.6);
  }

  @media (hover:hover){
    .btn.primary:hover{
      transform:translateY(-2px);
      box-shadow:0 16px 30px -10px rgba(10,15,56,.75);
    }
    .btn.accent:hover{
      transform:translateY(-2px);
      box-shadow:0 16px 30px -10px rgba(171,7,59,.7);
    }
    .btn:hover::after{ opacity:1; }
    .btn:hover .arrow{ transform:translateX(3px); }
  }

  .btn:active{
    transform:scale(.975);
    box-shadow:0 4px 14px -6px rgba(10,15,56,.5);
  }

  /* ── Футер ─────────────────────────── */
  .footer{
    display:flex;
    align-items:center;
    justify-content:center;
    padding-top:16px;
    border-top:1px solid #eceef4;
    font-size:13.5px;
  }

  .footer a{
    color:var(--navy);
    text-decoration:none;
    font-weight:800;
    letter-spacing:.3px;
    transition:color .15s ease;
  }

  .footer a:active{ color:var(--burgundy); }

  /* ── Адаптив ───────────────────────── */
  @media (max-width:380px){
    .card{ padding:34px 20px 20px; border-radius:18px; }
    .title{ font-size:17.5px; letter-spacing:1.2px; }
    .btn{ padding:15px 16px; gap:12px; font-size:14px; }
    .btn .icon{ width:38px; height:38px; }
  }

  @media (min-width:640px){
    .card{ max-width:430px; padding:44px 34px 28px; }
    .title{ font-size:22px; }
    .btn{ padding:19px 22px; }
  }

  @media (max-height:520px) and (orientation:landscape){
    .card{ padding:26px 24px 20px; }
    .logo-wrap{ min-height:64px; margin-bottom:12px; }
    .logo{ max-height:64px; }
    .subtitle{ margin-bottom:18px; }
  }
</style>
</head>
<body>

  <main class="card" role="main">

    <!-- Логотип -->
    <div class="logo-wrap">
      <img
        class="logo"
        src="https://avatars.mds.yandex.net/get-altay/18791287/2a000001a1c54408f9a5063027d65ff8fb7d/XXL"
        alt="АРТ СВЕТ — светильники"
        draggable="false"
        onerror="this.style.display='none';document.getElementById('logoFallback').style.display='block';">
      <div id="logoFallback">АРТ СВЕТ</div>
    </div>

    <!-- Заголовок -->
    <h1 class="title">3D <span>панорамный</span> тур</h1>
    <p class="subtitle">Светильники — шоурум в Самаре</p>

    <!-- 3D тур -->
    <a class="btn primary"
       href="https://vr360real-hue.github.io/ART_SVET/"
       target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 2 7l10 5 10-5-10-5z"/>
          <path d="m2 17 10 5 10-5"/>
          <path d="m2 12 10 5 10-5"/>
        </svg>
      </span>
      <span class="label">СМОТРЕТЬ 3D ТУР<small>Прогуляйтесь по шоуруму</small></span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>

    <!-- Наша визитка -->
    <a class="btn accent"
       href="https://cz60182.tw1.ru/ARTSVET/index.html"
       target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <path d="M3 9h18"/>
          <path d="M8 14h4M8 17h7"/>
        </svg>
      </span>
      <span class="label">НАША ВИЗИТКА<small>Все контакты и разделы</small></span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>

    <!-- Футер -->
    <div class="footer">
      <a href="tel:+79277083030">+7 (927) 708-30-30</a>
    </div>

  </main>

</body>
</html>
